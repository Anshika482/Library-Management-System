# Maven Wrapper configuration.
# Anyone who clones this repository can build it with ./mvnw (Linux/macOS) or
# mvnw.cmd (Windows) WITHOUT installing Maven themselves. The wrapper downloads
# the exact Maven version listed below into ~/.m2/wrapper on first use.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
