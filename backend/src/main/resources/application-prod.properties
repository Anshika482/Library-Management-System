# ==========================================================================
#  Library Management System - PRODUCTION overrides
# ==========================================================================
#  Active only when the prod profile is selected:
#
#      SPRING_PROFILES_ACTIVE=prod
#
#  Spring reads application.properties first and then this file on top, so
#  everything here replaces a development default. Nothing in this file has a
#  fallback value: ${VAR} with no colon means the application refuses to start
#  when VAR is missing, which is the only safe direction to be wrong in for a
#  production database.
#
#  What the deployment must supply:
#
#      DB_URL       the full JDBC URL, including TLS settings (see below)
#      DB_USERNAME  a dedicated account - NOT root
#      DB_PASSWORD  that account's password
#
#  Also required, as in every environment: JWT_SECRET, JWT_ISSUER,
#  JWT_AUDIENCE.
# ==========================================================================

# --------------------------------------------------------------------------
# Datasource
# --------------------------------------------------------------------------
# The URL is supplied whole rather than assembled here, because only the
# deployment knows its host, its database name and what its certificates
# allow. ProductionDatasourceValidator refuses the settings that are unsafe
# whatever the host is, and says so at startup rather than connecting anyway:
#
#   * useSSL=false                 - sends credentials and data in the clear
#   * allowPublicKeyRetrieval=true - lets a server in the middle hand over its
#                                    own key and collect the password
#   * createDatabaseIfNotExist=true- a typo in the name silently creates an
#                                    empty database and the app starts on it
#   * password= in the URL         - credentials belong in DB_PASSWORD, not in
#                                    a string that gets logged and shown in
#                                    connection metrics
#
# TLS must be asked for explicitly: sslMode=REQUIRED, VERIFY_CA or
# VERIFY_IDENTITY. The driver's own default is PREFERRED, which silently falls
# back to an unencrypted connection when the server does not offer TLS - the
# failure mode being guarded against here. VERIFY_IDENTITY is the strongest
# and needs the server certificate to match the host being connected to.
#
# A URL of the shape:
#
#   jdbc:mysql://db.internal:3306/library_db?sslMode=VERIFY_IDENTITY&serverTimezone=UTC
#
spring.datasource.url=${DB_URL}

# A dedicated account with rights on this schema only. Not root: an
# application that can drop every database on the server turns any flaw in it
# into a much larger incident.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --------------------------------------------------------------------------
# Schema
# --------------------------------------------------------------------------
# validate, never update. Hibernate checks that the tables match the entities
# and refuses to start if they do not; it alters nothing. Schema changes in
# production belong to a migration tool that runs deliberately, in a known
# order, and can be reviewed and rolled back - not to a side effect of an
# application starting up.
spring.jpa.hibernate.ddl-auto=validate

# --------------------------------------------------------------------------
# Logging
# --------------------------------------------------------------------------
# No SQL in the production log. The statements describe the schema to anyone
# who can read the log, and the bind-parameter logger would put the data
# itself - including whatever users typed - alongside it.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
