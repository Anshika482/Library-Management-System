# ==========================================================================
#  Library Management System - PRODUCTION overrides
# ==========================================================================
#  Active only when the prod profile is selected:
#
#      SPRING_PROFILES_ACTIVE=prod
#
#  Spring reads application.properties first and then this file on top, so
#  everything here replaces a development default. Nothing in this file has a
#  fallback value: ${VAR} with no colon means the application refuses to start
#  when VAR is missing, which is the only safe direction to be wrong in for a
#  production database.
#
#  What the deployment must supply:
#
#      DB_URL       the full JDBC URL, including TLS settings (see below)
#      DB_USERNAME  a dedicated account - NOT root - with rights to create
#                   and alter tables in this one schema, which Flyway needs
#                   to migrate it at startup
#      DB_PASSWORD  that account's password
#
#  Also required, as in every environment: JWT_SECRET, JWT_ISSUER,
#  JWT_AUDIENCE.
#
#  Required here only: PAYMENT_GATEWAY_PROVIDER=razorpay with
#  PAYMENT_GATEWAY_KEY_ID and PAYMENT_GATEWAY_KEY_SECRET. The sandbox gateway
#  marks fines paid without any money moving, so production refuses to start on
#  it - see ProductionPaymentValidator. Optional beside them:
#  PAYMENT_GATEWAY_BASE_URL, PAYMENT_GATEWAY_CONNECT_TIMEOUT,
#  PAYMENT_GATEWAY_READ_TIMEOUT, PAYMENT_CURRENCY.
#
#  Required here only: MAIL_HOST, a sender address (MAIL_FROM, or
#  MAIL_USERNAME to fall back to) and APP_RESET_LINK_BASE_URL, the page a
#  reset link points at. Without them a password reset is issued and never
#  delivered, so ProductionMailValidator stops startup instead. Optional
#  beside them: MAIL_PORT, MAIL_PASSWORD, MAIL_STARTTLS.
#
#  Optional: CORS_ALLOWED_ORIGINS, the exact browser origins allowed to call
#  the API from another site - see application.properties. Left unset, no
#  other site can.
#
#  Health probes, which need no token: GET /actuator/health/liveness and
#  GET /actuator/health/readiness - see application.properties.
#
#  Optional: FINE_DAILY_RATE, the fine per day a book is overdue - see
#  application.properties for the default.
#
#  Optional: JWT_REFRESH_TOKEN_VALIDITY, how long a login session can be kept
#  going with refresh tokens - see application.properties for the default.
#
#  Time zone: APP_TIME_ZONE (default Asia/Kolkata). The JVM must run in the
#  same zone - start it with -Duser.timezone=Asia/Kolkata - and DB_URL must not
#  set connectionTimeZone or serverTimezone to anything but UTC, nor
#  preserveInstants=false. Startup fails otherwise.
# ==========================================================================

# --------------------------------------------------------------------------
# Datasource
# --------------------------------------------------------------------------
# The URL is supplied whole rather than assembled here, because only the
# deployment knows its host, its database name and what its certificates
# allow. ProductionDatasourceValidator refuses the settings that are unsafe
# whatever the host is, and says so at startup rather than connecting anyway:
#
#   * useSSL=false                 - sends credentials and data in the clear
#   * allowPublicKeyRetrieval=true - lets a server in the middle hand over its
#                                    own key and collect the password
#   * createDatabaseIfNotExist=true- a typo in the name silently creates an
#                                    empty database and the app starts on it
#   * password= in the URL         - credentials belong in DB_PASSWORD, not in
#                                    a string that gets logged and shown in
#                                    connection metrics
#
# TLS must be asked for explicitly: sslMode=REQUIRED, VERIFY_CA or
# VERIFY_IDENTITY. The driver's own default is PREFERRED, which silently falls
# back to an unencrypted connection when the server does not offer TLS - the
# failure mode being guarded against here. VERIFY_IDENTITY is the strongest
# and needs the server certificate to match the host being connected to.
#
# A URL of the shape:
#
#   jdbc:mysql://db.internal:3306/library_db?sslMode=VERIFY_IDENTITY&serverTimezone=UTC
#
spring.datasource.url=${DB_URL}

# A dedicated account with rights on this schema only. Not root: an
# application that can drop every database on the server turns any flaw in it
# into a much larger incident.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --------------------------------------------------------------------------
# Schema
# --------------------------------------------------------------------------
# Flyway owns the schema. At startup it applies, in version order, every
# migration under db/migration that this database has not yet recorded in its
# flyway_schema_history table, and it finishes before Hibernate starts. Each
# applied migration is checksummed: if its file is edited afterwards, startup
# stops rather than running against a schema nobody can describe. A schema
# change is always a new file.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# clean drops every object in the schema. It has no business anywhere near a
# production database, so it is disabled explicitly rather than by default.
spring.flyway.clean-disabled=true

# A database that ddl-auto built before Flyway arrived has tables but no
# history table. Flyway refuses to start against it rather than guess, and
# that refusal is the point: such a database is baselined once, deliberately,
# after its schema has been checked against V1 - never automatically.
spring.flyway.baseline-on-migrate=false

# validate, never update. Hibernate checks that the migrated tables match the
# entities and refuses to start if they do not; it alters nothing.
spring.jpa.hibernate.ddl-auto=validate

# --------------------------------------------------------------------------
# Logging
# --------------------------------------------------------------------------
# No SQL in the production log. The statements describe the schema to anyone
# who can read the log, and the bind-parameter logger would put the data
# itself - including whatever users typed - alongside it.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
