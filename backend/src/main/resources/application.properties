# ==========================================================================
#  Library Management System - Backend Configuration
# ==========================================================================
#  Syntax note: ${ENV_VAR:defaultValue} means "use the environment variable
#  if it is set, otherwise use the default". ${ENV_VAR} with no colon has no
#  default: if the variable is missing the application refuses to start.
#
#  Every secret below uses the second form deliberately. A committed default
#  for a password or a signing key is not a convenience - it is a credential
#  published to everyone who can read this repository, and one that a
#  deployment silently falls back to when someone forgets to set the real
#  one. Failing to start is the safe outcome.
# ==========================================================================

# --------------------------------------------------------------------------
# Application identity and server
# --------------------------------------------------------------------------
spring.application.name=library-management-system

# The port the embedded Tomcat server listens on.
# The React frontend will call http://localhost:8080/api/... later.
server.port=8080


# --------------------------------------------------------------------------
# MySQL datasource  <-- SET DB_PASSWORD IN YOUR ENVIRONMENT BEFORE FIRST RUN
# --------------------------------------------------------------------------
# createDatabaseIfNotExist=true  -> MySQL creates 'library_db' automatically
# useSSL=false                   -> no TLS needed for local development
# allowPublicKeyRetrieval=true   -> required by MySQL 8 with caching_sha2_password
# serverTimezone=UTC             -> avoids timezone errors when saving dates
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
# Required, with no fallback, so there is no committed password to connect
# with. Unlike jwt.secret, an unset DB_PASSWORD is not caught by placeholder
# resolution: the relaxed binder passes the unsubstituted ${DB_PASSWORD}
# text to the driver as if it were the password, and MySQL answers "Access
# denied", which reads like a wrong password rather than a missing variable.
# An empty value is not caught either - a MySQL account with no password
# accepts it. DatasourcePasswordValidator refuses both before the connection
# pool is built.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The settings above are for local development and are deliberately not safe
# for production: TLS is off, the driver may fetch the server's public key, a
# missing database is created on demand, and the account defaults to root.
# Production overrides all of it in application-prod.properties, which is read
# on top of this file when SPRING_PROFILES_ACTIVE=prod, and whose settings are
# checked at startup by ProductionDatasourceValidator.


# --------------------------------------------------------------------------
# Time zone
# --------------------------------------------------------------------------
# The library's business day - issue dates, due-date checks, overdue status
# and fines - follows the JVM's default time zone, so the JVM must run in this
# one: start it with -Duser.timezone set to the same value (the pom does so for
# tests and mvnw spring-boot:run). The prod profile refuses to start otherwise.
app.time-zone=${APP_TIME_ZONE:Asia/Kolkata}

# DATETIME columns hold UTC: the driver converts to and from the JVM zone, and
# every existing row was written that way. Set here, not only in the URL, so a
# URL cannot silently drop it; the prod profile refuses a URL that contradicts
# it. DATE columns hold the calendar date, unconverted.
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC


# --------------------------------------------------------------------------
# JPA / Hibernate
# --------------------------------------------------------------------------
# ddl-auto=update -> Hibernate creates/updates tables from our @Entity classes.
#   Perfect while learning, and still how development and the tests build
#   their schema. Production does not: it runs Flyway migrations and Hibernate
#   only validates - see application-prod.properties.
spring.jpa.hibernate.ddl-auto=update

# Flyway is on the classpath but switched OFF here, so it stays off in
# development and in every test that does not ask for it. Those databases were
# built by ddl-auto and have no Flyway history table, and Flyway refuses to
# start against a non-empty schema it has no record of. The prod profile
# switches it on.
spring.flyway.enabled=false

# Print the generated SQL in the console - very useful for understanding and
# for debugging while you learn JPA.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tell Hibernate it is talking to MySQL 8.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Close the database session at the end of the service layer instead of keeping
# it open for the whole HTTP request. Recommended for REST APIs: it prevents
# accidental lazy-loading queries while writing the JSON response.
spring.jpa.open-in-view=false


# --------------------------------------------------------------------------
# Logging
# --------------------------------------------------------------------------
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG


# --------------------------------------------------------------------------
# JWT
# --------------------------------------------------------------------------
# The HMAC signing secret. HS256 is symmetric, so this value both signs and
# verifies: anyone holding it can mint a token for any account and walk in as
# that user without a password.
#
# Required, with no fallback. This property used to carry a development
# placeholder, which meant the application ran happily on a signing key
# published in this repository. That value is now refused outright - see
# JwtService - so restoring it here would not bring it back.
#
# Set JWT_SECRET to a private value of at least 32 characters. Blank, too
# short, or the retired placeholder all stop the application at startup.
jwt.secret=${JWT_SECRET}

# Who issues this API's tokens, and who they are for. Every token is stamped
# with both, and a token is refused unless it carries both and they match
# exactly.
#
# Neither is a secret - anyone holding a token can read them - so they are not
# what makes a token trustworthy; the signing key is. What they add is
# separation: two deployments that share a key by mistake still refuse each
# other's tokens, as long as each names itself differently. That is also why
# neither has a fallback. A committed default would be the same in every
# environment and would quietly undo the separation it exists to provide.
#
# Set JWT_ISSUER and JWT_AUDIENCE. Missing or blank stops the application at
# startup.
jwt.issuer=${JWT_ISSUER}
jwt.audience=${JWT_AUDIENCE}


# --------------------------------------------------------------------------
# Access tokens
# --------------------------------------------------------------------------
# How long an access token stays valid from the moment it is issued. An
# ISO-8601 duration; zero or negative stops the application at startup.
#
# This is the window in which a stolen token works, and the window in which a
# logged-out one still works: an access token is self-contained and checked
# without a database lookup, so nothing withdraws it early. Shorten it and
# clients refresh more often; lengthen it and a leaked token lasts longer.
#
# Disabling or locking an account is not subject to this window - the account's
# status is read from the database on every request, so it takes effect at once.
security.access-token.validity=${JWT_ACCESS_TOKEN_VALIDITY:PT1H}


# --------------------------------------------------------------------------
# Login rate limiting
# --------------------------------------------------------------------------
# How many consecutive failed logins a username may accumulate before further
# attempts are refused for a while, and how long that refusal lasts. Five is
# room for ordinary mistyping; fifteen minutes is long enough to make guessing
# pointless and short enough that nobody has to ask for help.
#
# The counters are held in memory by LoginAttemptService, so they apply to this
# instance only and are forgotten on restart. Run more than one instance and
# each keeps its own counters, multiplying the effective limit: a distributed
# deployment needs a shared rate limiter instead.
security.login.max-failed-attempts=5
security.login.block-duration=PT15M


# --------------------------------------------------------------------------
# Refresh tokens
# --------------------------------------------------------------------------
# How long a login session can be kept going with refresh tokens. Login issues
# one; every refresh replaces it and refuses the old one again, but never
# extends the session - after this long the user logs in again, however often
# they refreshed. An ISO-8601 duration; zero or negative stops startup.
#
# Access tokens are separate, and last security.access-token.validity each. One
# already issued stays valid until it expires, logout or not.
security.refresh-token.validity=${JWT_REFRESH_TOKEN_VALIDITY:P7D}

# How long a session's rows are kept after the session has ended, and how often
# the sweep that removes them runs. Both ISO-8601 durations.
#
# Rows outlive the session on purpose: an old token has to stay recognisable so
# that presenting it again is detected as reuse and ends the session, rather
# than looking like a token that never existed. Retention is that memory, and it
# must therefore be at least as long as security.refresh-token.validity - zero,
# negative or shorter than a session stops the application at startup.
#
# Only rows whose session ended before the cutoff are removed, so a live session
# is never touched. The sweep runs on every instance; deleting the same expired
# rows twice is harmless.
security.refresh-token.retention=${JWT_REFRESH_TOKEN_RETENTION:P30D}
security.refresh-token.cleanup-interval=${JWT_REFRESH_TOKEN_CLEANUP_INTERVAL:PT1H}


# --------------------------------------------------------------------------
# Self-service password reset
# --------------------------------------------------------------------------
# How long a reset token works after it is issued. Short on purpose: the link is
# meant to be used now, and a token is a credential while it lasts. An ISO-8601
# duration; zero, negative or longer than PT24H stops the application at startup.
security.password-reset.token-validity=${PASSWORD_RESET_TOKEN_VALIDITY:PT30M}

# How many resets one email address may ask for in a window. Beyond that the
# requests are dropped - still answered with the same 202, so the limit says
# nothing about whether the address has an account. Held in memory, per
# instance, like the login limit: several instances multiply it. The limit sits
# behind the PasswordResetRequestLimiter interface, so a shared implementation
# can replace the in-memory one without touching anything that uses it.
security.password-reset.max-requests=3
security.password-reset.request-window=PT15M

# How long a reset token is kept once it has stopped working - used, superseded
# or expired - and how often the sweep that removes such tokens runs. Kept a
# while so that a spent token presented again is logged as reuse. A token that
# can still be redeemed is never removed. ISO-8601 durations; a retention of
# zero or less stops the application at startup.
security.password-reset.retention=${PASSWORD_RESET_TOKEN_RETENTION:P1D}
security.password-reset.cleanup-interval=${PASSWORD_RESET_TOKEN_CLEANUP_INTERVAL:PT1H}


# --------------------------------------------------------------------------
# Password reset delivery (SMTP)
# --------------------------------------------------------------------------
# Where the reset link goes. Blank by default, and blank means nothing is
# sent: PasswordResetMailer logs that delivery is not configured and stops
# there, which is what a development machine with no mail server wants. The
# prod profile refuses to start that way - see ProductionMailValidator - so
# an unconfigured production deployment is a startup failure rather than a
# stream of resets nobody receives.
#
# MAIL_HOST is the SMTP server; MAIL_PORT defaults to the submission port.
# STARTTLS is on by default: the username, the password and the link itself
# travel over this connection, and the link is a credential while it lasts.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

# The address the message comes from. Blank falls back to MAIL_USERNAME,
# which is what most providers require anyway.
app.mail.from=${MAIL_FROM:}

# Where the link in the message points: the page that asks for a new password
# and posts it to /api/auth/reset-password. The token is added as a query
# parameter, so give the page's address without one, such as
# https://library.example.org/reset-password.
app.reset-link-base-url=${APP_RESET_LINK_BASE_URL:}


# --------------------------------------------------------------------------
# Fine payments through a payment provider
# --------------------------------------------------------------------------
# The provider that takes card payments for fines. Both values come from the
# provider's dashboard, and both are blank by default: with either missing,
# online payment is refused with 503 and fines are recorded at the desk
# instead, which is unaffected. Nothing is ever half-configured - an order that
# could not be verified afterwards is never opened.
#
# PAYMENT_GATEWAY_KEY_ID identifies this library to the provider's checkout and
# is public: it is sent to the browser with every order. PAYMENT_GATEWAY_KEY_SECRET
# is what makes a payment provable - it verifies the signature the provider
# returns - and is never logged, never stored on a payment row and never sent
# to a client. It is required with no committed default for the same reason
# JWT_SECRET is: a published signing key is no key at all.
#
# No card number, expiry, CVV or holder name is ever received, logged or
# stored by this application. The card is entered on the provider's pages.
# Which provider: "razorpay" for the real one, or "hmac-sandbox" for local
# development, where orders are opened in process and no request leaves the
# machine. Everything else about a payment - the signature check, the
# server-side verification, the audit event - is the same code either way. An
# unknown name stops startup rather than quietly falling back to the sandbox.
#
# The sandbox is the default because development and CI have no merchant
# account. The prod profile refuses to start on it - see
# ProductionPaymentValidator - because a sandbox payment marks a fine paid
# while no money moves, and nothing inside the application would notice.
payment.gateway.provider=${PAYMENT_GATEWAY_PROVIDER:hmac-sandbox}

# Razorpay's API. Overridden only to point at a stub in tests; there is no
# separate sandbox host - Razorpay tells test keys from live ones by the key.
payment.gateway.base-url=${PAYMENT_GATEWAY_BASE_URL:https://api.razorpay.com}

# How long to wait for the provider when opening an order. ISO-8601 durations;
# zero or less stops the application at startup, because on most clients that
# means "wait for ever".
#
# Short on purpose: the call happens inside the transaction that writes the
# payment row, so a provider that accepts a connection and then goes quiet
# would hold a database connection for as long as it liked. A caller who waits
# past these gets a 503 and can pay at the desk instead.
payment.gateway.connect-timeout=${PAYMENT_GATEWAY_CONNECT_TIMEOUT:PT3S}
payment.gateway.read-timeout=${PAYMENT_GATEWAY_READ_TIMEOUT:PT8S}
payment.gateway.key-id=${PAYMENT_GATEWAY_KEY_ID:}
payment.gateway.key-secret=${PAYMENT_GATEWAY_KEY_SECRET:}

# The currency a fine is charged in, as a three-letter ISO code. One currency
# per deployment, matching the fine rate in library.fines.daily-rate.
payment.currency=${PAYMENT_CURRENCY:INR}


# --------------------------------------------------------------------------
# First administrator (bootstrap)
# --------------------------------------------------------------------------
# A fresh database has no account, and every endpoint that creates one needs an
# administrator already signed in. These settings break that circle exactly
# once: when the account table is empty at startup, they create the first
# library and its administrator, and nothing else ever reads them.
#
# They are required only in that case. A database that already has accounts
# ignores them entirely - blank is the normal state of a running deployment,
# and leaving real credentials in the environment after the first start is
# pointless rather than dangerous, since the bootstrap will not run again.
#
# All four are needed together when the table is empty; an incomplete or
# invalid set stops the application at startup, naming the variable but never
# its value.
bootstrap.admin.library=${BOOTSTRAP_ADMIN_LIBRARY:}
bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}


# --------------------------------------------------------------------------
# CORS
# --------------------------------------------------------------------------
# The browser origins allowed to call this API from another site: a
# comma-separated list of exact origins, scheme://host[:port], for example
#
#   CORS_ALLOWED_ORIGINS=https://library.example.org,http://localhost:5173
#
# Empty by default, which allows no cross-origin browser access at all. That is
# the safe direction to be wrong in, which is why a fallback is acceptable here
# when it is not for a secret. A wildcard, a path, a trailing slash or
# credentials in an entry stop the application at startup rather than being
# interpreted.
#
# Same-origin requests, and clients that send no Origin header - curl, another
# server - are unaffected either way. Behind a reverse proxy, list the origin
# the browser actually sees.
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}


# --------------------------------------------------------------------------
# Health and readiness (Spring Boot Actuator)
# --------------------------------------------------------------------------
# For whatever runs this service: a load balancer, an orchestrator, a monitor.
# Actuator can publish far more than health - the environment, the
# configuration, every bean, a heap dump - so every endpoint is switched off
# and only two are switched back on, read-only, and only those two are
# reachable over HTTP:
#
#   GET /actuator/health            overall status
#   GET /actuator/health/liveness   is the process alive - restart it if not
#   GET /actuator/health/readiness  can it serve requests - send it traffic
#   GET /actuator/info              deliberately empty
#
# These answer without a token (see SecurityConfig), so they say nothing but a
# status: no components and no details, for an administrator as much as for
# anyone. A failed database check reports DOWN, never the error, the host or
# the account behind it.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.info.access=read-only
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Liveness and readiness answer different questions, so they check different
# things. Readiness includes the database: every API request loads the
# caller's account from it, so an instance that cannot reach it cannot serve
# anything and should be given no traffic. Liveness leaves it out: restarting
# the application does not fix a database outage, and restarting every
# instance at once would turn one outage into two.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# The mail starter brings a health indicator that opens an SMTP connection
# every time health is read, and reports DOWN when it cannot. Switched off: an
# instance whose mail server is unreachable still serves every request, and a
# reset that cannot be delivered is already handled - the token stands and the
# holder asks again. Left on, an SMTP outage would take the whole deployment
# out of the load balancer, and a development machine with no mail server at
# all would never report healthy.
management.health.mail.enabled=false

# No info contributors. env, java, os and process are off by default. build
# and git are on by default, and would publish the exact version and commit to
# anyone - the first thing worth knowing when looking for a known
# vulnerability - as soon as a build produced the file they read.
management.info.build.enabled=false
management.info.git.enabled=false


# --------------------------------------------------------------------------
# Overdue loans and fines
# --------------------------------------------------------------------------
# The fine for each day a book is kept past its due date: one rate, for every
# library and every book, with at most two decimal places. 0 charges nothing
# while loans are still reported overdue. A negative or malformed value stops
# the application at startup.
#
# A loan is overdue from the day after its due date, and owes the days since
# then times this rate - worked out whenever the loan is read, never added up
# day by day. Returning the book fixes the fine, so changing the rate later
# does not alter what an already-returned loan owed.
library.fines.daily-rate=${FINE_DAILY_RATE:1.00}
