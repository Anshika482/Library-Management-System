# ==========================================================================
#  Library Management System - Backend Configuration
# ==========================================================================
#  Syntax note: ${ENV_VAR:defaultValue} means "use the environment variable
#  if it is set, otherwise use the default". This keeps real passwords out of
#  Git while still letting the project run locally out of the box.
# ==========================================================================

# --------------------------------------------------------------------------
# Application identity and server
# --------------------------------------------------------------------------
spring.application.name=library-management-system

# The port the embedded Tomcat server listens on.
# The React frontend will call http://localhost:8080/api/... later.
server.port=8080


# --------------------------------------------------------------------------
# MySQL datasource  <-- EDIT THE PASSWORD BELOW BEFORE FIRST RUN
# --------------------------------------------------------------------------
# createDatabaseIfNotExist=true  -> MySQL creates 'library_db' automatically
# useSSL=false                   -> no TLS needed for local development
# allowPublicKeyRetrieval=true   -> required by MySQL 8 with caching_sha2_password
# serverTimezone=UTC             -> avoids timezone errors when saving dates
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:***REMOVED***}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# --------------------------------------------------------------------------
# JPA / Hibernate
# --------------------------------------------------------------------------
# ddl-auto=update -> Hibernate creates/updates tables from our @Entity classes.
#   Perfect while learning. A production system would use 'validate' plus a
#   migration tool such as Flyway or Liquibase.
spring.jpa.hibernate.ddl-auto=update

# Print the generated SQL in the console - very useful for understanding and
# for debugging while you learn JPA.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tell Hibernate it is talking to MySQL 8.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Close the database session at the end of the service layer instead of keeping
# it open for the whole HTTP request. Recommended for REST APIs: it prevents
# accidental lazy-loading queries while writing the JSON response.
spring.jpa.open-in-view=false


# --------------------------------------------------------------------------
# Logging
# --------------------------------------------------------------------------
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG


# --------------------------------------------------------------------------
# JWT
# --------------------------------------------------------------------------
# The HMAC signing secret. Anyone holding it can mint a token for any account,
# so the real one belongs in the JWT_SECRET environment variable and never in
# this file. The fallback below is a DEVELOPMENT PLACEHOLDER ONLY - it is
# public, it is in Git, and it must not be used anywhere real. Minimum 32
# characters; HS256 refuses a shorter key rather than signing weakly.
jwt.secret=${JWT_SECRET:dev-only-placeholder-not-a-real-secret-replace-via-JWT_SECRET-env-var}
