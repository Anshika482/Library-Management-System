# ==========================================================================
#  Library Management System - Backend Configuration
# ==========================================================================
#  Syntax note: ${ENV_VAR:defaultValue} means "use the environment variable
#  if it is set, otherwise use the default". ${ENV_VAR} with no colon has no
#  default: if the variable is missing the application refuses to start.
#
#  Every secret below uses the second form deliberately. A committed default
#  for a password or a signing key is not a convenience - it is a credential
#  published to everyone who can read this repository, and one that a
#  deployment silently falls back to when someone forgets to set the real
#  one. Failing to start is the safe outcome.
# ==========================================================================

# --------------------------------------------------------------------------
# Application identity and server
# --------------------------------------------------------------------------
spring.application.name=library-management-system

# The port the embedded Tomcat server listens on.
# The React frontend will call http://localhost:8080/api/... later.
server.port=8080


# --------------------------------------------------------------------------
# MySQL datasource  <-- SET DB_PASSWORD IN YOUR ENVIRONMENT BEFORE FIRST RUN
# --------------------------------------------------------------------------
# createDatabaseIfNotExist=true  -> MySQL creates 'library_db' automatically
# useSSL=false                   -> no TLS needed for local development
# allowPublicKeyRetrieval=true   -> required by MySQL 8 with caching_sha2_password
# serverTimezone=UTC             -> avoids timezone errors when saving dates
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
# Required, with no fallback, so there is no committed password to connect
# with. Unlike jwt.secret, an unset DB_PASSWORD is not caught by placeholder
# resolution: the relaxed binder passes the unsubstituted ${DB_PASSWORD}
# text to the driver as if it were the password, and MySQL answers "Access
# denied", which reads like a wrong password rather than a missing variable.
# An empty value is not caught either - a MySQL account with no password
# accepts it. DatasourcePasswordValidator refuses both before the connection
# pool is built.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The settings above are for local development and are deliberately not safe
# for production: TLS is off, the driver may fetch the server's public key, a
# missing database is created on demand, and the account defaults to root.
# Production overrides all of it in application-prod.properties, which is read
# on top of this file when SPRING_PROFILES_ACTIVE=prod, and whose settings are
# checked at startup by ProductionDatasourceValidator.


# --------------------------------------------------------------------------
# JPA / Hibernate
# --------------------------------------------------------------------------
# ddl-auto=update -> Hibernate creates/updates tables from our @Entity classes.
#   Perfect while learning, and still how development and the tests build
#   their schema. Production does not: it runs Flyway migrations and Hibernate
#   only validates - see application-prod.properties.
spring.jpa.hibernate.ddl-auto=update

# Flyway is on the classpath but switched OFF here, so it stays off in
# development and in every test that does not ask for it. Those databases were
# built by ddl-auto and have no Flyway history table, and Flyway refuses to
# start against a non-empty schema it has no record of. The prod profile
# switches it on.
spring.flyway.enabled=false

# Print the generated SQL in the console - very useful for understanding and
# for debugging while you learn JPA.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tell Hibernate it is talking to MySQL 8.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Close the database session at the end of the service layer instead of keeping
# it open for the whole HTTP request. Recommended for REST APIs: it prevents
# accidental lazy-loading queries while writing the JSON response.
spring.jpa.open-in-view=false


# --------------------------------------------------------------------------
# Logging
# --------------------------------------------------------------------------
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG


# --------------------------------------------------------------------------
# JWT
# --------------------------------------------------------------------------
# The HMAC signing secret. HS256 is symmetric, so this value both signs and
# verifies: anyone holding it can mint a token for any account and walk in as
# that user without a password.
#
# Required, with no fallback. This property used to carry a development
# placeholder, which meant the application ran happily on a signing key
# published in this repository. That value is now refused outright - see
# JwtService - so restoring it here would not bring it back.
#
# Set JWT_SECRET to a private value of at least 32 characters. Blank, too
# short, or the retired placeholder all stop the application at startup.
jwt.secret=${JWT_SECRET}

# Who issues this API's tokens, and who they are for. Every token is stamped
# with both, and a token is refused unless it carries both and they match
# exactly.
#
# Neither is a secret - anyone holding a token can read them - so they are not
# what makes a token trustworthy; the signing key is. What they add is
# separation: two deployments that share a key by mistake still refuse each
# other's tokens, as long as each names itself differently. That is also why
# neither has a fallback. A committed default would be the same in every
# environment and would quietly undo the separation it exists to provide.
#
# Set JWT_ISSUER and JWT_AUDIENCE. Missing or blank stops the application at
# startup.
jwt.issuer=${JWT_ISSUER}
jwt.audience=${JWT_AUDIENCE}


# --------------------------------------------------------------------------
# Login rate limiting
# --------------------------------------------------------------------------
# How many consecutive failed logins a username may accumulate before further
# attempts are refused for a while, and how long that refusal lasts. Five is
# room for ordinary mistyping; fifteen minutes is long enough to make guessing
# pointless and short enough that nobody has to ask for help.
#
# The counters are held in memory by LoginAttemptService, so they apply to this
# instance only and are forgotten on restart. Run more than one instance and
# each keeps its own counters, multiplying the effective limit: a distributed
# deployment needs a shared rate limiter instead.
security.login.max-failed-attempts=5
security.login.block-duration=PT15M


# --------------------------------------------------------------------------
# CORS
# --------------------------------------------------------------------------
# The browser origins allowed to call this API from another site: a
# comma-separated list of exact origins, scheme://host[:port], for example
#
#   CORS_ALLOWED_ORIGINS=https://library.example.org,http://localhost:5173
#
# Empty by default, which allows no cross-origin browser access at all. That is
# the safe direction to be wrong in, which is why a fallback is acceptable here
# when it is not for a secret. A wildcard, a path, a trailing slash or
# credentials in an entry stop the application at startup rather than being
# interpreted.
#
# Same-origin requests, and clients that send no Origin header - curl, another
# server - are unaffected either way. Behind a reverse proxy, list the origin
# the browser actually sees.
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}


# --------------------------------------------------------------------------
# Health and readiness (Spring Boot Actuator)
# --------------------------------------------------------------------------
# For whatever runs this service: a load balancer, an orchestrator, a monitor.
# Actuator can publish far more than health - the environment, the
# configuration, every bean, a heap dump - so every endpoint is switched off
# and only two are switched back on, read-only, and only those two are
# reachable over HTTP:
#
#   GET /actuator/health            overall status
#   GET /actuator/health/liveness   is the process alive - restart it if not
#   GET /actuator/health/readiness  can it serve requests - send it traffic
#   GET /actuator/info              deliberately empty
#
# These answer without a token (see SecurityConfig), so they say nothing but a
# status: no components and no details, for an administrator as much as for
# anyone. A failed database check reports DOWN, never the error, the host or
# the account behind it.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.info.access=read-only
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Liveness and readiness answer different questions, so they check different
# things. Readiness includes the database: every API request loads the
# caller's account from it, so an instance that cannot reach it cannot serve
# anything and should be given no traffic. Liveness leaves it out: restarting
# the application does not fix a database outage, and restarting every
# instance at once would turn one outage into two.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# No info contributors. env, java, os and process are off by default. build
# and git are on by default, and would publish the exact version and commit to
# anyone - the first thing worth knowing when looking for a known
# vulnerability - as soon as a build produced the file they read.
management.info.build.enabled=false
management.info.git.enabled=false


# --------------------------------------------------------------------------
# Overdue loans and fines
# --------------------------------------------------------------------------
# The fine for each day a book is kept past its due date: one rate, for every
# library and every book, with at most two decimal places. 0 charges nothing
# while loans are still reported overdue. A negative or malformed value stops
# the application at startup.
#
# A loan is overdue from the day after its due date, and owes the days since
# then times this rate - worked out whenever the loan is read, never added up
# day by day. Returning the book fixes the fine, so changing the rate later
# does not alter what an already-returned loan owed.
library.fines.daily-rate=${FINE_DAILY_RATE:1.00}
